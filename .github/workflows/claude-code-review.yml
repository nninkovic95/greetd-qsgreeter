name: Claude Code Review

# Automatic review of PRs that touch the greeter, its packaging or the
# compositor configs. Repo-specific review rules live in CLAUDE.md, which the
# code-review plugin reads.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "qsgreeter/**"
      - "niri/**"
      - "hyprland/**"
      - "Makefile"
      - "PKGBUILD"
      - ".github/workflows/**"
      - "CLAUDE.md"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true   # a new push supersedes the running review

jobs:
  claude-review:
    # Skip drafts, and PRs from forks (secrets are not available to them).
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write   # post inline review comments
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--max-turns 30 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
