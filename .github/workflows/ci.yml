name: CI

# Lint the QML, run the greeter through login under Xvfb, and check that it
# installs and packages, on every push and pull request. Publishing to the
# AUR is release.yml, on tags only. Jobs run in an Arch container so qmllint,
# Quickshell and makepkg match what the package is built against.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  qmllint:
    name: qmllint
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git jq qt6-declarative quickshell

      - name: Checkout repository
        uses: actions/checkout@v4

      # The workspace is owned by the runner user, not the container's root.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Syntax errors fail the job; other findings are annotations only.
      - name: Lint QML
        run: .github/scripts/qmllint.sh qsgreeter

  build:
    name: Install and package
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed base-devel git pacman-contrib greetd quickshell glib2 accountsservice

      - name: Checkout repository
        uses: actions/checkout@v4

      # The workspace is owned by the runner user, not the container's root.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: make install / uninstall into a scratch root
        run: |
          root=$(mktemp -d)
          make install DESTDIR="$root"
          test -f "$root/etc/xdg/quickshell/qsgreeter/shell.qml"
          test -f "$root/usr/share/licenses/qsgreeter/LICENSE"
          expected=$(find qsgreeter -type f | wc -l)
          got=$(find "$root/etc/xdg/quickshell/qsgreeter" -type f | wc -l)
          if [ "$got" -ne "$expected" ]; then
            echo "::error::make install copied $got of $expected files from qsgreeter/"
            exit 1
          fi
          make uninstall DESTDIR="$root"
          if [ -n "$(find "$root" -type f)" ]; then
            echo "::error::make uninstall left files behind"
            find "$root" -type f
            exit 1
          fi

      - name: Build the release package from this commit
        run: .github/scripts/build-package.sh 0.0.0 local

  ui:
    name: Greeter UI
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git qt6-declarative qt6-svg mesa xorg-server-xvfb ttf-dejavu

      - name: Checkout repository
        uses: actions/checkout@v4

      # The workspace is owned by the runner user, not the container's root.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The real greeter QML on Xvfb with Mesa's software renderer, against the
      # stub Quickshell and greetd modules in tests/ui/stubs. Fails unless it
      # lists the users, opens the login screen with keyboard focus in the
      # password field, recovers from a wrong password without losing focus,
      # and launches the session with the right one and the XDG variables.
      - name: Run the greeter through login
        run: tests/ui/run.sh ui-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greeter-screenshots
          path: ui-screenshots/
          if-no-files-found: warn
          retention-days: 14
