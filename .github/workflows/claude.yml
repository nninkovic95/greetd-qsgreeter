name: Claude Code

# @claude on an issue, PR, review or review comment. Only the owner and
# collaborators can trigger it: the repo is public, and every run spends the
# CLAUDE_CODE_OAUTH_TOKEN quota.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues'
        && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # push commits to branches / PR heads
      pull-requests: write   # open PRs, comment
      issues: write          # comment on issues
      id-token: write
      actions: read          # read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history: pkgver() in PKGBUILD counts commits

      # qmllint gives Claude a syntax check for QML edits. Quickshell's own
      # modules are not installed, so unresolved-import warnings are expected.
      - name: Install QML tooling
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 40
            --allowed-tools "Bash(make install DESTDIR=*),Bash(make uninstall DESTDIR=*),Bash(qmllint *),Bash(git log *),Bash(git diff *),Bash(git status),Bash(git show *),Bash(find *),Bash(grep *),Bash(ls *),Bash(mktemp *),Bash(jq *)"
